# PROD profile: PostgreSQL. Activate with SPRING_PROFILES_ACTIVE=prod.
# All secrets and environment-specific values come from environment variables.
# Required: DB_URL, DB_USERNAME, DB_PASSWORD, APP_BASE_URL
# Optional: DB_POOL_SIZE, CORS_ALLOWED_ORIGINS (comma-separated)
server:
  shutdown: graceful
  # Ingress / load balancer sets X-Forwarded-*; needed so rate limits key on the real client IP.
  forward-headers-strategy: framework

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    # e.g. jdbc:postgresql://db-host:5432/urlshortener
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000   # ms; fail fast so API can return 503 on DB trouble
      validation-timeout: 2000
      max-lifetime: 1800000
  jpa:
    hibernate:
      # Schema is managed by Flyway migrations only; Hibernate must never alter it.
      ddl-auto: validate
    show-sql: false
  h2:
    console:
      enabled: false

app:
  base-url: ${APP_BASE_URL}
  url-validation:
    allow-private-hosts: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# Kubernetes liveness/readiness at /actuator/health/liveness and /actuator/health/readiness.
management:
  endpoint:
    health:
      probes:
        enabled: true

# No interactive docs in production; the contract is committed as docs/openapi.json.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    com.bharath.projects.urlshortener: INFO

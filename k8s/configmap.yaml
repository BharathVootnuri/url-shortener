apiVersion: v1
kind: ConfigMap
metadata:
  name: url-shortener
  namespace: url-shortener
data:
  SPRING_PROFILES_ACTIVE: "prod"
  # Public origin used to build shortUrl in API responses. Must match how clients reach the app.
  APP_BASE_URL: "https://short.example.com"
  DB_POOL_SIZE: "10"
  # Comma-separated origins if you serve a UI from another host. Leave unset to allow none.
  # CORS_ALLOWED_ORIGINS: "https://app.example.com"
